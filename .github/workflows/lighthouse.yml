name: Lighthouse CI

# Runs Lighthouse against the static site on every push to main and every PR.
# Fails the build if Performance, LCP, CLS, or TBT regress beyond set thresholds.
# Reports are uploaded to temporary public storage and linked in the run summary.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed (saves CI minutes)
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.x

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          # Optional: enables richer PR comments. Create this secret via
          # https://github.com/apps/lighthouse-ci (install the GitHub App,
          # then add the token it gives you as a repo secret named LHCI_GITHUB_APP_TOKEN).
          # If not set, the workflow still runs and reports in the Actions logs.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Show report links
        if: always()
        run: |
          echo "## Lighthouse CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Report links (valid for 7 days):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # LHCI logs report URLs to stdout; capture and surface them in the summary
          find . -name "*.json" -path "*lhr*" 2>/dev/null | head -1 | xargs -I {} cat {} 2>/dev/null | grep -oE 'https://storage.googleapis.com/lighthouse-infrastructure[^"]*' | head -5 | while read url; do
            echo "- $url" >> $GITHUB_STEP_SUMMARY
          done || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full details: check the 'Run Lighthouse CI' step logs above." >> $GITHUB_STEP_SUMMARY
